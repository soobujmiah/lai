<text x="55" y="55" fill="#8ff0ad" font-family="sans-serif" font-size="15" font-weight="700" letter-spacing="3">LAI · LOCAL AI + CONSENT-DRIVEN AUTOMATION</text>
<text x="55" y="91" fill="#fff" font-family="sans-serif" font-size="27" font-weight="700">Policy-gated Android runtime with evidence-bound backends</text>
