<rect x="635" y="135" width="245" height="150" rx="18" fill="url(#card)" stroke="#2c6b43"/><text x="658" y="168" fill="#8ff0ad" font-size="13" font-weight="700">ANDROID AUTHORITIES</text><text x="658" y="202" fill="#fff" font-size="20" font-weight="700">Accessibility</text><text x="658" y="230" fill="#b8cfc0" font-size="14">Shizuku / ADB UID</text><text x="658" y="253" fill="#b8cfc0" font-size="14">explicit confirmation required</text>
