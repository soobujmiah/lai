name: Android build

on:
  push:
    branches: [main, 'gpu/opencl-qualification-probe']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: >-
          APK variant. Default 'release' builds ONLY the signed release APK.
          Choose 'debug' or 'both' when debugging is needed.
        required: true
        default: release
        type: choice
        options: [debug, release, both]
      validated_accelerators:
        description: >-
          Accelerators the scheduler may select (DEVICE_VALIDATED evidence).
          Default EMPTY = CPU-only. Set llama-opencl only after physical-device
          qualification; llama-vulkan remains experimental on the affected device.
        required: false
        default: ''
        type: string

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_VERSION: '9.5.0'
  ANDROID_API: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK: '27.0.12077973'
  CMAKE_VERSION: '3.22.1'
  LLAMA_CPP_COMMIT: 'ad1de39e0708e3ced9c71bb3c82d93a2c046a73f'
  VULKAN_HEADERS_TAG: 'v1.4.311'
  SPIRV_HEADERS_TAG: 'vulkan-sdk-1.4.357.0'
  OPENCL_HEADERS_COMMIT: '15b536b7fbe1098cea462a27db496b287ac89b63'
  OPENCL_ICD_LOADER_COMMIT: '45cdbda4ddd31c324e32a744f112087c42da18f7'

jobs:
  source-policy:
    name: Source and documentation policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce source-only repository
        run: bash scripts/validate_repo.sh

  build:
    name: Compile Kotlin, C++ and APK
    needs: source-policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
      - name: Install remote Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK}" "cmake;${CMAKE_VERSION}"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Decode optional release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then exit 0; fi
          KEYSTORE_FILE="${RUNNER_TEMP}/lai-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          {
            echo "LAI_KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "LAI_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "LAI_KEY_ALIAS=$KEY_ALIAS"
            echo "LAI_KEY_PASSWORD=$KEY_PASSWORD"
            echo "LAI_SIGNING_PRODUCTION=true"
          } >> "$GITHUB_ENV"
      - name: Ensure release signing key (production or deterministic test)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          python3 -m pip install --quiet --disable-pip-version-check cryptography
          python3 scripts/ci/generate_test_keystore.py "$RUNNER_TEMP/lai-test-release.p12"
          {
            echo "LAI_KEYSTORE_FILE=$RUNNER_TEMP/lai-test-release.p12"
            echo "LAI_KEYSTORE_PASSWORD=lai-test-release"
            echo "LAI_KEY_ALIAS=lai-test"
            echo "LAI_KEY_PASSWORD=lai-test-release"
            echo "LAI_SIGNING_PRODUCTION=false"
          } >> "$GITHUB_ENV"
      - name: Fetch pinned llama.cpp source
        shell: bash
        run: |
          bash scripts/ci/fetch_llama_cpp.sh "$LLAMA_CPP_COMMIT" "$RUNNER_TEMP/llama.cpp"
          echo "LAI_LLAMA_CPP_DIR=$RUNNER_TEMP/llama.cpp" >> "$GITHUB_ENV"
      - name: Fetch pinned Vulkan-Headers
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vulkan-headers"
          curl -fsSL "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/${VULKAN_HEADERS_TAG}.tar.gz" | tar -xz -C "$RUNNER_TEMP/vulkan-headers" --strip-components=1
          test -f "$RUNNER_TEMP/vulkan-headers/include/vulkan/vulkan.hpp"
          echo "LAI_VULKAN_HEADERS_DIR=$RUNNER_TEMP/vulkan-headers" >> "$GITHUB_ENV"
      - name: Fetch pinned SPIRV-Headers
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/spirv-headers"
          curl -fsSL "https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/tags/${SPIRV_HEADERS_TAG}.tar.gz" | tar -xz -C "$RUNNER_TEMP/spirv-headers" --strip-components=1
          test -f "$RUNNER_TEMP/spirv-headers/include/spirv/unified1/spirv.hpp"
          echo "LAI_SPIRV_HEADERS_DIR=$RUNNER_TEMP/spirv-headers" >> "$GITHUB_ENV"
      - name: Fetch OpenCL headers and build ICD loader
        shell: bash
        run: |
          set -euo pipefail
          HEADERS_DIR="$RUNNER_TEMP/opencl-headers"
          ICD_DIR="$RUNNER_TEMP/opencl-icd-loader"
          mkdir -p "$HEADERS_DIR" "$ICD_DIR"
          curl -fsSL "https://github.com/KhronosGroup/OpenCL-Headers/archive/${OPENCL_HEADERS_COMMIT}.tar.gz" | tar -xz -C "$HEADERS_DIR" --strip-components=1
          curl -fsSL "https://github.com/KhronosGroup/OpenCL-ICD-Loader/archive/${OPENCL_ICD_LOADER_COMMIT}.tar.gz" | tar -xz -C "$ICD_DIR" --strip-components=1
          NDK_ROOT="${ANDROID_HOME}/ndk/${ANDROID_NDK}"
          cmake -S "$ICD_DIR" -B "$ICD_DIR/build" -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=28 -DANDROID_STL=c++_shared -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DOPENCL_ICD_LOADER_HEADERS_DIR="$HEADERS_DIR"
          cmake --build "$ICD_DIR/build" -- -j"$(nproc)"
          test -f "$ICD_DIR/build/libOpenCL.a"
          echo "LAI_OPENCL_INCLUDE_DIR=$HEADERS_DIR" >> "$GITHUB_ENV"
          echo "LAI_OPENCL_LIBRARY=$ICD_DIR/build/libOpenCL.a" >> "$GITHUB_ENV"
      - name: Install Vulkan build dependencies
        shell: bash
        run: |
          timeout 90 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -qq || true
          for attempt in 1 2 3; do timeout 240 sudo apt-get install -y -qq --no-install-recommends glslc spirv-headers spirv-tools glslang-tools libvulkan-dev && break || sleep 15; done
          command -v glslc
      - name: Unit tests and lint
        run: >-
          gradle --no-daemon --stacktrace coverageCheck :platform:audit:testDebugUnitTest :platform:download:testDebugUnitTest :platform:workspace:testDebugUnitTest :platform:history:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug
          -Plai.enableLlamaCpp=ON -Plai.llamaCppDir="$LAI_LLAMA_CPP_DIR"
          -Plai.vulkanHeadersDir="$LAI_VULKAN_HEADERS_DIR" -Plai.spirvHeadersDir="$LAI_SPIRV_HEADERS_DIR"
          -Plai.openclIncludeDir="$LAI_OPENCL_INCLUDE_DIR" -Plai.openclLibrary="$LAI_OPENCL_LIBRARY"
          -Plai.validatedAccelerators="${{ inputs.validated_accelerators }}"
      - name: Build debug APK
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_type != 'release') }}
        run: >-
          gradle --no-daemon --stacktrace :app:assembleDebug
          -Plai.versionCode=${{ github.run_number }} -Plai.versionName=0.6.${{ github.run_number }}
          -Plai.enableLlamaCpp=ON -Plai.llamaCppDir="$LAI_LLAMA_CPP_DIR"
          -Plai.vulkanHeadersDir="$LAI_VULKAN_HEADERS_DIR" -Plai.spirvHeadersDir="$LAI_SPIRV_HEADERS_DIR"
          -Plai.openclIncludeDir="$LAI_OPENCL_INCLUDE_DIR" -Plai.openclLibrary="$LAI_OPENCL_LIBRARY"
          -Plai.validatedAccelerators="${{ inputs.validated_accelerators }}"
      - name: Build release APK
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_type != 'debug') }}
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION_NAME" == "$GITHUB_REF_NAME" ]]; then VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"; fi
          gradle --no-daemon --stacktrace :app:assembleRelease \
            -Plai.versionCode="${GITHUB_RUN_NUMBER}" -Plai.versionName="$VERSION_NAME" \
            -Plai.enableLlamaCpp=ON -Plai.llamaCppDir="$LAI_LLAMA_CPP_DIR" \
            -Plai.vulkanHeadersDir="$LAI_VULKAN_HEADERS_DIR" -Plai.spirvHeadersDir="$LAI_SPIRV_HEADERS_DIR" \
            -Plai.openclIncludeDir="$LAI_OPENCL_INCLUDE_DIR" -Plai.openclLibrary="$LAI_OPENCL_LIBRARY" \
            -Plai.validatedAccelerators="${{ inputs.validated_accelerators }}"
      - name: Inventory artifacts
        if: always()
        shell: bash
        run: find app runtime -type f \( -name '*.apk' -o -name 'liblai_runtime.so' \) -print 2>/dev/null || true
      - name: Upload debug APK
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_type != 'release') }}
        uses: actions/upload-artifact@v7
        with:
          name: lai-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload release APK
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_type != 'debug') }}
        uses: actions/upload-artifact@v7
        with:
          name: lai-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lai-sbom-${{ github.run_number }}
          path: app/build/sbom/
          if-no-files-found: ignore
