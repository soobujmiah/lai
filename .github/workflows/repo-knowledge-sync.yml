name: Repo Knowledge Sync

# Rollout of soobujmiah/skb's governance/DETERMINISTIC_STATE_SYNC_POLICY.md to this repository
# (DEC-2026-09-25-002). tools/repo_knowledge/ and schemas/*.schema.json are vendored copies from
# soobujmiah/skb -- see tools/repo_knowledge/README.md and docs/BUILD_AND_RELEASE.md. Do not
# hand-edit .repo/; it is regenerated by this workflow.
#
# Unlike the ggen/onskillit-platform rollouts, this workflow does NOT re-run the build itself:
# android_build.yml is a 45-minute native/Vulkan/OpenCL/Hexagon toolchain build that fetches
# gigabytes of dependencies, signs APKs, and can publish real GitHub Releases. Duplicating it here
# would be wasteful and could trigger unwanted side effects. Instead this workflow triggers via
# `workflow_run` when "Android build" completes on main, and reads that run's own job/step
# conclusions through the GitHub API -- see docs/BUILD_AND_RELEASE.md for the exact mapping.

on:
  workflow_run:
    workflows: ["Android build"]
    types: [completed]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  test:
    # Guards the vendored tools/repo_knowledge copy. Runs on every trigger; cheap, no Android
    # toolchain involved.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Run tools/repo_knowledge tests
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py' -v

  sync:
    needs: test
    # Nothing meaningful to sync on a bare PR to this workflow file, and nothing worth computing
    # for an Android build run that wasn't on main (a PR build's status isn't main's state) --
    # only run for a main-branch Android build completing, or a manual dispatch.
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # Checking out an exact SHA (needed so .repo/ reflects precisely the commit the
      # triggering Android build actually validated, not whatever main has moved to since)
      # leaves Git in detached-HEAD state, which made head.branch record the literal string
      # "HEAD" instead of the real branch name. Point a local branch ref at the checked-out
      # commit so core.py's `git rev-parse --abbrev-ref HEAD` reports the true branch.
      - name: Restore branch name after exact-SHA checkout
        run: git checkout -B "${{ github.event.workflow_run.head_branch || github.ref_name }}"

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Derive build/test status from the Android build run
        id: derive
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
            --paginate > jobs.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open("jobs.json") as f:
              jobs = json.load(f)["jobs"]

          def find_job(name):
              return next((j for j in jobs if j["name"] == name), None)

          def step_conclusion(job, name):
              if not job:
                  return None
              for s in job.get("steps") or []:
                  if s["name"] == name:
                      return s["conclusion"]
              return None

          policy_job = find_job("Source and documentation policy")
          build_job = find_job("Compile Kotlin, C++ and APK")
          test_conclusion = step_conclusion(build_job, "Unit tests and lint")
          policy_conclusion = policy_job["conclusion"] if policy_job else None

          # build.status: could this run have produced a usable build at all? A failed policy
          # gate or a failed test step means no, regardless of whether a later packaging step
          # happened to run. If we can't tell (e.g. steps missing/skipped), leave it alone rather
          # than guess -- an empty output means "don't pass --build-status this run".
          if policy_conclusion == "failure" or test_conclusion == "failure":
              build_status = "failed"
          elif test_conclusion == "success" and policy_conclusion == "success":
              build_status = "passed"
          else:
              build_status = ""

          test_status = {"success": "passed", "failure": "failed"}.get(test_conclusion, "")

          print(f"build_status={build_status}")
          print(f"test_status={test_status}")
          PY

      - name: Collect and sync deterministic state
        if: always()
        run: |
          set -euo pipefail
          args=(--ci --build-run-id "${{ github.event.workflow_run.id || github.run_id }}")
          if [ -n "${{ steps.derive.outputs.build_status }}" ]; then
            args+=(--build-status "${{ steps.derive.outputs.build_status }}")
          fi
          if [ -n "${{ steps.derive.outputs.test_status }}" ]; then
            args+=(--test-status "${{ steps.derive.outputs.test_status }}" --test-summary "Unit tests and lint (android_build.yml)")
          fi
          python3 -m tools.repo_knowledge sync "${args[@]}"

      - name: Verify .repo/ against schemas
        if: always()
        run: python3 -m tools.repo_knowledge verify

      - name: Commit updated .repo/ state
        # Only for a real push-triggered Android build run on main -- never for a PR build, a
        # tag-triggered release run, or a manual dispatch, so this never pushes to main from an
        # ambiguous ref.
        if: >-
          always() &&
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        run: |
          set -euo pipefail
          if git diff --quiet -- .repo; then
            echo "no .repo/ change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .repo
          git commit -m "chore(repo-knowledge): sync deterministic state for ${{ github.event.workflow_run.head_sha }}"
          git push origin HEAD:main
