name: Repo Knowledge Sync
# Observe real CI. No project build is rerun and collector setup is never evidence.
on:
  workflow_run:
    workflows: ["Android build"]
    types: [completed]
  pull_request:
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: repo-state-main
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python -m pip install --quiet pyyaml
      - run: python3 -m unittest discover -s tools/repo_knowledge/tests -v
  sync:
    needs: test
    if: >-
      always() && github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - run: python -m pip install --quiet pyyaml
      - name: Collect exact source CI result and step evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          python3 -m tools.repo_knowledge.ci_evidence \
            --run-id "$SOURCE_RUN" --workflow android_build.yml \
            --branch main --test-step "Unit tests and lint"
      - run: python3 -m tools.repo_knowledge verify
      - name: Publish validated state only
        run: |
          set -euo pipefail
          python3 -m tools.repo_knowledge verify
          git add .repo
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(repo-knowledge): record source CI run ${{ github.event.workflow_run.id }}"
          git push origin HEAD:main
